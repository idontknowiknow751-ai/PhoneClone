
name: Build PhoneClone APK

on:
  push:
    paths:
      - "PhoneClone.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: unzip -q PhoneClone.zip -d .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: PhoneClone
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneClone-apk
          path: PhoneClone/app/build/outputs/apk/debug/app-debug.apk
          
